; PHP-FPM-Pool fuer die PSA-Zentrale (Repo vps_projekt)
[psa]
user = psa
group = psa

; Socket, ueber den Caddy die Anfragen schickt
listen = /run/php/php8.3-fpm-psa.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

; Prozesse nur bei Bedarf starten (wenig Verkehr)
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 60s
pm.max_requests = 500

; Notbremse etwas ueber max_execution_time (600 s)
request_terminate_timeout = 660s
