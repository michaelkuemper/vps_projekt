; PSA-Zentrale: eigene PHP-Einstellungen fuer FPM (Repo vps_projekt)
; Romane als EPUB hochladen
upload_max_filesize = 25M
post_max_size = 30M
; Big-Wilma-Auswertung kann einige Minuten dauern
max_execution_time = 600
memory_limit = 256M
; PHP-Version nicht in HTTP-Antworten verraten
expose_php = Off
date.timezone = Europe/Berlin
